name: dbms

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: dbms-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__LOG_LEVEL: "${QDRANT_LOG_LEVEL:-INFO}"
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-local-dev-key-change-me}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - databases

  teradata-client:
    profiles: ["teradata"]
    build:
      context: ./teradata-client
      args:
        TERADATASQL_VERSION: "${TERADATASQL_VERSION:-20.0.0.72}"
    image: dbms/teradata-client:${TERADATASQL_VERSION:-20.0.0.72}
    container_name: dbms-teradata-client
    restart: unless-stopped
    environment:
      TERADATA_HOST: "${TERADATA_HOST:-}"
      TERADATA_USER: "${TERADATA_USER:-dbc}"
      TERADATA_PASSWORD: "${TERADATA_PASSWORD:-}"
      TERADATA_LOGMECH: "${TERADATA_LOGMECH:-TD2}"
      TERADATA_ENCRYPTDATA: "${TERADATA_ENCRYPTDATA:-true}"
    command: ["sh", "-c", "python /app/healthcheck.py && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    networks:
      - databases

volumes:
  qdrant_data:
    name: dbms_qdrant_data

networks:
  databases:
    name: dbms_databases

